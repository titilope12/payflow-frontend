name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_PLAN_REGISTRY_ID: CDLGJKHOZ4UY4HJXFND7VPEGAFJOBQB7E2W7IGO3JIJLZ6WIX2NCIQ3V
          NEXT_PUBLIC_VAULT_ID: CABD66DE3FEREIHPS77XUFRTA5EBSE3RZLCRPE3MOYHO42AH7NEAERL5
          NEXT_PUBLIC_SUBSCRIPTION_ID: CAM2ISZPOZXMYUIC7WPAXKTU6I4QY4HGWLGATK65EWOPRMTHKAWBMMKR
          NEXT_PUBLIC_TOKEN_ID: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          NEXT_PUBLIC_API_URL: http://localhost:8080
